# Host Nginx edge config for staging admin.
# Place on the VPS as /etc/nginx/sites-available/admin-stage.7oz-espresso.com
# then: ln -s ... sites-enabled && certbot --nginx -d admin-stage.7oz-espresso.com
#
# Proxies to the staging compose gateway (HTTP_PORT=127.0.0.1:8088).

server {
    listen 80;
    listen [::]:80;
    server_name admin-stage.7oz-espresso.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
